[package]
name = "lofiji"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "An atmospheric lofi terminal clock with optional Pomodoro and music"
license = "MIT"

[dependencies]
ratatui = "=0.26.3"
crossterm = "=0.27.0"
chrono = "=0.4.31"
serde = { version = "=1.0.197", features = ["derive"] }
toml = "=0.8.12"
signal-hook = "=0.3.18"
png = "=0.17.10"
libc = "=0.2.152"
gif = "=0.12.0"
serde_json = "=1.0.108"
